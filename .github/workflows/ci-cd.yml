name: Python CI/CD Pipeline

# Вказуємо, коли запускати цей пайплайн (при кожному push або pull_request)
on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13" # Версія, на якій ми працюємо

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Flake8
      run: |
        # Запуск лінтера з генерацією HTML-звіту у папку flake8-report
        flake8 . --format=html --htmldir=flake8-report

    - name: Test with Pytest
      run: |
        # Запуск тестів з генерацією HTML-звіту
        pytest --html=pytest-report.html --self-contained-html

    - name: Upload Flake8 HTML Report
      uses: actions/upload-artifact@v4
      if: always() # Завантажувати звіт навіть якщо лінтер знайшов помилки
      with:
        name: flake8-report
        path: flake8-report/

    - name: Upload Pytest HTML Report
      uses: actions/upload-artifact@v4
      if: always() # Завантажувати звіт навіть якщо тести впали
      with:
        name: pytest-report
        path: pytest-report.html